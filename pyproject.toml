[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-submeter"
version = "0.1.0"
description = "Low-interaction, trustworthy virtual submetering research prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
virtual-submeter = "virtual_submeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
